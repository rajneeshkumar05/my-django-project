{% extends "base.html" %}
{% block title %}Post List{% endblock %}

{% block content %}
    <h2>Post List</h2>
    <ul>
        {% for post in posts %}
            <li>{{ post.title }} - {{ post.content }}</li>
        {% empty %}
            <li>No posts available.</li>
        {% endfor %}
    </ul>
{% endblock %}
